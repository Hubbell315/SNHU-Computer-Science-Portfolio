<div class="row" *ngIf="isLoggedIn()">
  <button
    (click)="addTrip()"
    class="btn btn-info"
  >
    Add Trip
  </button>
</div>

<div class="row mt-3 mb-3">

  <div class="col-md-5">
    <label
      for="resortFilter"
      class="form-label"
    >
      Search by resort
    </label>

    <input
      id="resortFilter"
      #resortFilter
      type="text"
      class="form-control"
      maxlength="100"
      placeholder="Enter a resort or destination"
      (keyup.enter)="searchTrips(resortFilter.value)"
    >
  </div>

  <div
    class="col-md-3 d-flex align-items-end gap-2"
  >
    <button
      type="button"
      class="btn btn-primary"
      (click)="searchTrips(resortFilter.value)"
    >
      Search
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="clearSearch(resortFilter)"
    >
      Clear
    </button>
  </div>

  <div class="col-md-4">

    <label
      for="sortOption"
      class="form-label"
    >
      Sort matching trips
    </label>

    <select
      id="sortOption"
      #sortOption
      class="form-select"
      (change)="changeSort(sortOption.value)"
    >
      <option value="default">
        Default order
      </option>

      <option value="price-asc">
        Price: low to high
      </option>

      <option value="price-desc">
        Price: high to low
      </option>

      <option value="duration-asc">
        Duration: shortest to longest
      </option>

      <option value="duration-desc">
        Duration: longest to shortest
      </option>
    </select>

  </div>

</div>

<p>{{ message }}</p>

<div class="row">

  <div
    *ngFor="let trip of trips"
    class="col-md-4"
  >
    <app-trip-card
      [trip]="trip"
      class="card-deck mt-2"
    >
    </app-trip-card>
  </div>

</div>
